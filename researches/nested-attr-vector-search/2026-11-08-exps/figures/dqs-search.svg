<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<rect width="100%" height="100%" fill="#fff"/>
<g transform="scale(0.9 1)">
<title id="title">DQS query procedure with independent candidate and keep queues</title><desc id="desc">The query creates descendant closure D, seeds nearest representatives from every nonempty attribute in D, and offers objects. Offers are marked once per query, filtered by scope before distance calculation, independently admitted into q1 and q2, then candidate queues are popped by distance and neighbors offered. When both candidate queues are empty, the keep sets are merged and deduplicated for top k.</desc>
<style>text{font-family:'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif;fill:#172536}.box{fill:#fff;stroke:#2563a8;stroke-width:2}.decision{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.q1{fill:#eff6ff;stroke:#2563a8;stroke-width:2}.q2{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.out{fill:#ecfdf5;stroke:#198754;stroke-width:2}.reject{fill:#fff1f2;stroke:#be123c;stroke-width:1.8}.arrow{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#arr)}.label{font-size:16px;font-weight:700}.small{font-size:14px;fill:#334155}.note{font-size:14px;fill:#475569}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<text x="28" y="34" class="label" font-size="21">DQS：双准入通道，共享一次查询的候选展开</text>
<rect class="box" x="28" y="62" width="180" height="68" rx="12"/><text x="118" y="89" class="label" text-anchor="middle">输入 q 与 U</text><text x="118" y="112" class="small" text-anchor="middle">属性 OR 查询</text>
<path class="arrow" d="M208 96H241"/><rect class="box" x="247" y="62" width="190" height="68" rx="12"/><text x="342" y="89" class="label" text-anchor="middle">位图 OR 得 D</text><text x="342" y="112" class="small" text-anchor="middle">完整后代闭包</text>
<path class="arrow" d="M437 96H470"/><rect class="box" x="476" y="62" width="235" height="68" rx="12"/><text x="593" y="89" class="label" text-anchor="middle">全 D 每个非空属性</text><text x="593" y="112" class="small" text-anchor="middle">取最近代表点作种子</text>
<path class="arrow" d="M711 96H744"/><rect class="box" x="750" y="62" width="270" height="68" rx="12"/><text x="885" y="89" class="label" text-anchor="middle">offer：首次接触立即打标</text><text x="885" y="112" class="small" text-anchor="middle">本查询内后续重复调用返回</text>
<path class="arrow" d="M885 130V169"/><polygon class="decision" points="885,170 942,218 885,266 828,218"/><text x="885" y="215" class="small" text-anchor="middle">own(v)</text><text x="885" y="233" class="small" text-anchor="middle">在 D 内？</text>
<path class="arrow" d="M828 218H743"/><rect class="reject" x="506" y="184" width="230" height="68" rx="12"/><text x="621" y="210" class="label" text-anchor="middle">范围外立即返回</text><text x="621" y="234" class="small" text-anchor="middle">不算距离、不入队、不展开</text>
<path class="arrow" d="M885 266V294"/><text x="898" y="286" class="small">范围内</text><rect class="box" x="752" y="300" width="266" height="64" rx="12"/><text x="885" y="327" class="label" text-anchor="middle">计算一次查询距离</text><text x="885" y="350" class="small" text-anchor="middle">种子距离也会计入</text>
<path class="arrow" d="M752 332H670V411H641"/><path class="arrow" d="M1018 332H1046V411H1019"/>
<rect class="q1" x="175" y="406" width="468" height="92" rx="14"/><text x="409" y="436" class="label" text-anchor="middle">q1：全部合格对象</text><text x="409" y="461" class="small" text-anchor="middle">keep₁ 容量 ef；准入时同时写入 cand₁ 与 keep₁</text><text x="409" y="484" class="small" text-anchor="middle">keep₁ 最远项决定准入阈值</text>
<rect class="q2" x="657" y="406" width="362" height="92" rx="14"/><text x="838" y="436" class="label" text-anchor="middle">q2：代表点或网关</text><text x="838" y="461" class="small" text-anchor="middle">独立尝试；keep₂ 容量 ef₂</text><text x="838" y="484" class="small" text-anchor="middle">准入时同时写入 cand₂ 与 keep₂</text>
<path class="arrow" d="M409 498V525H440"/><path class="arrow" d="M838 498V525H700"/><polygon class="decision" points="570,505 700,556 570,607 440,556"/><text x="570" y="550" class="label" text-anchor="middle">任一 cand 非空？</text><text x="570" y="574" class="small" text-anchor="middle">取较近堆头弹出</text>
<path class="arrow" d="M570 607V620"/><text x="585" y="619" class="small">是：弹出并扫描邻居</text><rect class="box" x="318" y="625" width="360" height="54" rx="12"/><text x="498" y="648" class="label" text-anchor="middle">offer 邻居；陈旧项可展开，节点可重复展开</text><text x="498" y="669" class="small" text-anchor="middle">扫描局部边与跨属性边</text>
<path class="arrow" d="M318 652H62V150H770V136"/><text x="45" y="497" class="note" transform="rotate(-90 45 497)">再次调用 offer，访问代号阻止重复打分</text>
<path class="arrow" d="M700 556H1034V616H1008"/><text x="867" y="544" class="small" text-anchor="middle">否：两 cand 都空，结束</text><rect class="out" x="757" y="616" width="254" height="66" rx="12"/><text x="884" y="643" class="label" text-anchor="middle">合并 keep，去重取 top-k</text><text x="884" y="666" class="small" text-anchor="middle">无每属性堆；不跨查询复用结果</text>
<text x="28" y="690" class="note">ef / ef₂ 限制 keep 容量，不是 cand 的硬容量或距离调用上限；q2.keep 同样参与最终结果。</text>
</g>
</svg>
