<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="title desc">
<title id="title">目录倒排表与分区HNSW的实际存储结构</title>
<desc id="desc">示例装箱目标为四。目录A直接拥有对象1和2，其子目录B拥有3和4，另一个目录C拥有5、6和7。元数据侧保存直接成员倒排表和属性记录。物理侧将A与B装入P0，C装入P1，各分区有独立HNSW，不存在图间层级导航。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.4">
<rect x="15" y="50" width="240" height="380" rx="10"/>
<rect x="290" y="50" width="270" height="380" rx="10"/>
<rect x="595" y="50" width="310" height="380" rx="10"/>
<path d="M135 115L80 167M135 115L197 167M48 185H30V269H48"/>
<rect x="104" y="88" width="62" height="30" rx="5"/>
<rect x="48" y="168" width="64" height="34" rx="5"/>
<rect x="166" y="168" width="62" height="34" rx="5"/>
<rect x="48" y="252" width="64" height="34" rx="5"/>
<path d="M260 240H282M565 240H587" marker-end="url(#arrow)"/>
<rect x="310" y="88" width="230" height="145" rx="6"/>
<rect x="310" y="263" width="230" height="140" rx="6"/>
<rect x="615" y="88" width="270" height="145" rx="6"/>
<rect x="615" y="263" width="270" height="140" rx="6"/>
<path d="M665 158L721 135L780 161L837 136M665 158L780 161M721 135L837 136"/>
<path d="M680 336L751 309L822 345L680 336"/>
<g fill="currentColor"><circle cx="665" cy="158" r="5"/><circle cx="721" cy="135" r="5"/><circle cx="780" cy="161" r="5"/><circle cx="837" cy="136" r="5"/><circle cx="680" cy="336" r="5"/><circle cx="751" cy="309" r="5"/><circle cx="822" cy="345" r="5"/></g>
</g>
<g fill="currentColor" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15">
<text x="15" y="28" font-size="20" font-weight="bold">索引形式：元数据结构与向量图分离</text>
<text x="35" y="76" font-weight="bold">逻辑目录树</text><text x="310" y="76" font-weight="bold">目录倒排表＋对象属性</text><text x="615" y="76" font-weight="bold">平坦物理分区，每区一张图</text>
<text x="135" y="109" text-anchor="middle">root</text><text x="80" y="191" text-anchor="middle">A</text><text x="197" y="191" text-anchor="middle">C</text><text x="80" y="275" text-anchor="middle">B</text>
<text x="41" y="225">直接成员 {1,2}</text><text x="153" y="244">{5,6,7}</text><text x="41" y="311">直接成员 {3,4}</text>
<text x="35" y="365">A 是 B 的父目录</text><text x="35" y="392">层级属于目录，不属于属性</text>
<text x="328" y="116" font-weight="bold">直接成员 postings</text><text x="328" y="148">A → {1,2}</text><text x="328" y="179">B → {3,4}</text><text x="328" y="210">C → {5,6,7}</text>
<text x="328" y="289" font-weight="bold">按对象 ID 寻址的记录</text><text x="328" y="319">owner / category</text><text x="328" y="349">numeric / tags / alive</text><text x="328" y="382">posting 实存为 (word,bits)</text>
<text x="633" y="114" font-weight="bold">P0：A 与 B 共置</text><text x="655" y="187">1</text><text x="718" y="155">2</text><text x="776" y="189">3</text><text x="834" y="164">4</text><text x="633" y="216">loc(1…4) = P0</text>
<text x="633" y="288" font-weight="bold">P1：C 单独成区</text><text x="668" y="365">5</text><text x="747" y="337">6</text><text x="819" y="373">7</text><text x="633" y="389">loc(5…7) = P1</text>
<text x="15" y="460">示例 B=4；仅示意初始 DFS 装箱。两张 HNSW 独立，图间无导航边；图内仅画一层。</text>
</g></svg>
