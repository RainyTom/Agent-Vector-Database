<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
<title id="title">DAG属性层级的继承匹配与跨分支交叠</title>
<desc id="desc">概念图含Computing methodologies、Information systems、Machine learning、Information retrieval四个节点，Retrieval models and ranking同时是Machine learning与Information retrieval的子节点。论文p1只标注Retrieval models and ranking，其继承集合包含全部五个概念；p2直接标注Machine learning，p3直接标注Information retrieval。因此S(ML)={p1,p2}，S(IR)={p1,p3}，两者相交于p1，即使ML与IR互非祖先。</desc>
<defs><marker id="da" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.4">
<rect x="15" y="55" width="400" height="395" rx="9"/>
<rect x="435" y="55" width="470" height="395" rx="9"/>
<rect x="30" y="110" width="190" height="34" rx="5"/>
<rect x="240" y="110" width="170" height="34" rx="5"/>
<rect x="30" y="196" width="190" height="34" rx="5"/>
<rect x="240" y="196" width="170" height="34" rx="5"/>
<rect x="95" y="288" width="290" height="38" rx="5"/>
<path d="M125 144V196M325 144V196M125 230L190 288M325 230L290 288"/>
<path d="M125 326V348H300V326" marker-end="url(#da)"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK SC, sans-serif" font-size="15">
<text x="15" y="31" font-size="20" font-weight="bold">层级属性为 DAG：多父概念使不同分支的对象集合相交</text>
<text x="35" y="82" font-weight="bold">概念图（多父节点）</text><text x="455" y="82" font-weight="bold">对象标注与继承匹配</text>
<text x="125" y="132" text-anchor="middle">Computing methodologies</text>
<text x="325" y="132" text-anchor="middle">Information systems</text>
<text x="125" y="218" text-anchor="middle">Machine learning</text>
<text x="325" y="218" text-anchor="middle">Information retrieval</text>
<text x="240" y="313" text-anchor="middle">Retrieval models and ranking</text>
<text x="35" y="360">该概念同时有两个父，构成多父结构</text>
<text x="35" y="392">祖先闭包按可达性计算，</text><text x="35" y="418">同一对象可属于互非祖先的两个 scope</text>
<text x="455" y="118" font-size="14">p1 直接标注 {Retrieval models and ranking}</text>
<text x="455" y="142" font-size="14">　 继承 {RMR, Machine learning, Information retrieval, …}</text>
<text x="455" y="176" font-size="14">p2 直接标注 {Machine learning}</text>
<text x="455" y="200" font-size="14">　 继承 {Machine learning, Computing methodologies}</text>
<text x="455" y="234" font-size="14">p3 直接标注 {Information retrieval}</text>
<text x="455" y="258" font-size="14">　 继承 {Information retrieval, Information systems}</text>
<text x="455" y="292" font-size="14">S(Machine learning) = {p1, p2}</text>
<text x="455" y="316" font-size="14">S(Information retrieval) = {p1, p3}</text>
<text x="455" y="346" font-size="14" font-weight="bold">S(ML) ∩ S(IR) = {p1} ≠ ∅（ML 与 IR 互非祖先）</text>
<text x="455" y="374" font-size="14">直接标注集合 D(ML) = {p2}，与 S(ML) 不同</text>
<text x="455" y="402" font-size="14">S(RMR) ⊆ S(ML) ⊆ S(Computing methodologies)</text>
<text x="455" y="426" font-size="14">祖先包含成立；同级分支不是划分，查询按对象 ID 去重</text>
</g></svg>
