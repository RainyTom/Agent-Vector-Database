<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">DAG 层级属性：继承、交叠与多标签删除</title>
<desc id="desc">示意 DAG 的边为 R 到 A、R 到 B、A 到 C、B 到 C、A 到 D。C 有两个父概念。p1 直接标注 C，p2 标注 A，p3 标注 B，p4 同时标注 A 和 C。S(A) 与 S(B) 交于 p1、p4；删除 p4 的 C 标签后，p4 仍属于 S(A)。</desc>
<defs><marker id="da" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="currentColor"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.4">
<rect x="15" y="58" width="410" height="430" rx="9"/>
<rect x="445" y="58" width="500" height="430" rx="9"/>
<rect x="170" y="104" width="100" height="38" rx="5"/>
<rect x="65" y="195" width="110" height="38" rx="5"/>
<rect x="275" y="195" width="110" height="38" rx="5"/>
<rect x="30" y="298" width="100" height="38" rx="5"/>
<rect x="205" y="298" width="110" height="38" rx="5"/>
<path d="M200 142L133 195M240 142L315 195M110 233L85 298M135 233L242 298M315 233L277 298" marker-end="url(#da)"/>
</g>
<g fill="currentColor" font-family="Noto Sans CJK SC, sans-serif" font-size="15">
<text x="15" y="32" font-size="20" font-weight="bold">DAG 层级属性：继承集合可交叠，对象只返回一次</text>
<text x="35" y="86" font-weight="bold">示意概念图：边表示一般 → 细化</text>
<text x="220" y="129" text-anchor="middle">根 R</text>
<text x="120" y="220" text-anchor="middle">概念 A</text>
<text x="330" y="220" text-anchor="middle">概念 B</text>
<text x="80" y="323" text-anchor="middle">概念 D</text>
<text x="260" y="323" text-anchor="middle">多父概念 C</text>
<text x="35" y="378">A 与 B 互非祖先，但共享后代 C</text>
<text x="35" y="408">直接标注 A，不推出满足 C 或 D</text>
<text x="35" y="438">继承按可达闭包计算，路径先去重</text>
<text x="35" y="468">物理分区归属唯一，逻辑 scope 可交叠</text>
<text x="465" y="86" font-weight="bold">直接标签 → 继承标签</text>
<text x="465" y="125">p1：{C} → {C, A, B, R}</text>
<text x="465" y="156">p2：{A} → {A, R}</text>
<text x="465" y="187">p3：{B} → {B, R}</text>
<text x="465" y="218">p4：{A, C} → {C, A, B, R}</text>
<text x="465" y="266">S(A) = {p1, p2, p4}</text>
<text x="465" y="297">S(B) = {p1, p3, p4}</text>
<text x="465" y="328" font-weight="bold">S(A) ∩ S(B) = {p1, p4}</text>
<text x="465" y="359">查询 {A, B} 的并集只有 4 个对象</text>
<text x="465" y="405" font-weight="bold">多标签更新按成员关系变化维护</text>
<text x="465" y="436">删除 p4 的 C 标签：{A, C} → {A}</text>
<text x="465" y="467">保留 A、R 的匹配；仅删除 B、C 的匹配</text>
</g></svg>
